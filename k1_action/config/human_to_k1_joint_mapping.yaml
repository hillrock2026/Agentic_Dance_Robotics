# Human(SMPL) -> Booster K1 joint mapping
# All facts below verified against K1_22dof.xml (runtime-loaded) and the
# official CSVs (k1_fight_001.csv / k1_mj2_seg1.csv). See
# docs/K1_ACTION_FORMAT_ANALYSIS_V1.md for evidence.

smpl_joint_ids:          # indices into Motion Studio joint_positions (T,24,3)
  pelvis: 0
  left_hip: 1
  right_hip: 2
  spine1: 3
  left_knee: 4
  right_knee: 5
  spine2: 6
  left_ankle: 7
  right_ankle: 8
  spine3: 9
  left_foot: 10          # toe
  right_foot: 11
  neck: 12
  left_collar: 13
  right_collar: 14
  head: 15
  left_shoulder: 16
  right_shoulder: 17
  left_elbow: 18
  right_elbow: 19
  left_wrist: 20
  right_wrist: 21

# K1 XML actuator/joint order (== official CSV column order after the
# aa-prefix normalization), verified column-by-column.
k1_joint_order:   # exact names as loaded from K1_22dof.xml (verified)
  - aahead_yaw_joint
  - aahead_pitch_joint
  - aaleft_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_elbow_pitch_joint
  - left_elbow_yaw_joint
  - aaright_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_elbow_pitch_joint
  - right_elbow_yaw_joint
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_pitch_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_pitch_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint

# official CSV column names differ for limbs: no "aa" prefix on left/right
# arms & legs (head keeps it). Map CSV name -> XML name.
csv_to_xml_name:   # only 2 names differ between official CSV and XML
  left_shoulder_pitch_joint: aaleft_shoulder_pitch_joint
  right_shoulder_pitch_joint: aaright_shoulder_pitch_joint

chains:
  head:
    joints: [aahead_yaw_joint, aahead_pitch_joint]
    source: [neck, head]              # segment neck->head
    method: derived                   # yaw/pitch from head direction
    quality: best_effort              # head roll dropped
  left_arm:
    joints: [aaleft_shoulder_pitch_joint, left_shoulder_roll_joint,
             left_elbow_pitch_joint, left_elbow_yaw_joint]
    upper: [left_shoulder, left_elbow]     # upper-arm segment
    fore:  [left_elbow, left_wrist]        # forearm segment
    method: ik_direction
    quality: upper=exact(best), fore=best_effort   # K1 has no wrist: 1 pos DOF
  right_arm:
    joints: [aaright_shoulder_pitch_joint, right_shoulder_roll_joint,
             right_elbow_pitch_joint, right_elbow_yaw_joint]
    upper: [right_shoulder, right_elbow]
    fore:  [right_elbow, right_wrist]
    method: ik_direction
    quality: upper=exact(best), fore=best_effort
  left_leg:
    joints: [left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint,
             left_knee_pitch_joint, left_ankle_pitch_joint, left_ankle_roll_joint]
    thigh: [left_hip, left_knee]
    shank: [left_knee, left_ankle]
    foot:  [left_ankle, left_foot]
    method: ik_direction              # hip->thigh (3DOF, exact), knee->shank,
    quality: thigh=exact(best), shank=best_effort, foot=best_effort
  right_leg:
    joints: [right_hip_pitch_joint, right_hip_roll_joint, right_hip_yaw_joint,
             right_knee_pitch_joint, right_ankle_pitch_joint, right_ankle_roll_joint]
    thigh: [right_hip, right_knee]
    shank: [right_knee, right_ankle]
    foot:  [right_ankle, right_foot]
    method: ik_direction
    quality: thigh=exact(best), shank=best_effort, foot=best_effort

# Human DOF with no K1 counterpart (dropped, recorded in metadata):
dropped_human_dof:
  spine: "3 SMPL spine joints (3x3 rot) -> no K1 torso joint; torso lean folded into root yaw only"
  wrists: "human wrist 2x3 rot -> covered best-effort by K1 elbow_yaw (twist only)"
  hands:  "SMPL hand joints (22,23) -> no K1 hand DOF"
  collar: "clavicle segments -> rigid with torso"

# Root mapping (human -> K1 free joint)
root:
  yaw: "from human global_orient forward vector (horizontal), mapped via torso-frame R"
  roll_pitch: "dropped (K1 stance kept upright; balance is a controller problem)"
  xy: "human pelvis transl (x,z in MS) mapped 1:1 into K1 ground plane via R"
  z: "K1 stance height + human pelvis height variation scaled by leg-length ratio"

limits:
  margin_frac: 0.02        # 2% range margin applied during IK
  hard_clip: false         # never silently clip: violations are recorded
  max_joint_vel_rad_s: 8.0 # physical sanity threshold for flagging
  max_joint_acc_rad_s2: 200.0

retargeting:
  ik_iters: 60
  smoothing_window_frames: 5   # moving average on joint trajectories
  output_fps: 50               # internal standard (official CSV fps unknown)
